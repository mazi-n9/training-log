  --ink:#1A1714;--surface:#221E1A;--raised:#2B2621;--steel:#3B342C;--bone:#EFE9DF;--mute:#9B9189;--amber:#E8A33D;--amber-dim:#7A5A23;--rust:#C4553A;--moss:#7E9A5C;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#1A1714;--surface:#221E1A;--raised:#2B2621;--steel:#3B342C;--bone:#EFE9DF;--mute:#9B9189;--amber:#E8A33D;--amber-dim:#7A5A23;--rust:#C4553A;--moss:#7E9A5C; } }
:root[data-theme="dark"]{ --ink:#1A1714;--surface:#221E1A;--raised:#2B2621;--steel:#3B342C;--bone:#EFE9DF;--mute:#9B9189;--amber:#E8A33D;--amber-dim:#7A5A23;--rust:#C4553A;--moss:#7E9A5C; }
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink);height:100%;}
body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);
  font-family:Barlow,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
*,*::before,*::after{box-sizing:border-box;}
button{font-family:inherit;}
.boot{max-width:520px;margin:0 auto;padding:40px 14px;color:var(--mute);font-size:15px;}

.wt{min-height:100%;}
.wt-wrap{max-width:520px;margin:0 auto;padding:0 14px 170px;}
.cond{font-family:'Barlow Condensed',Barlow,'Arial Narrow',sans-serif;letter-spacing:.01em;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--mute);} .small{font-size:13px;} .tiny{font-size:12px;}

.wt-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);
  border-bottom:1px solid var(--steel);padding:12px 0 10px;display:flex;align-items:center;gap:10px;}
.wt-top h1{font-family:'Barlow Condensed',Barlow,'Arial Narrow',sans-serif;font-weight:700;font-size:24px;margin:0;line-height:1.05;}
.wt-top .sub{color:var(--mute);font-size:13px;margin-top:2px;}
.elapsed{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1;}

.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin:10px 0 12px;}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);flex:none;}
.sync.idle .dot{background:var(--mute);}
.sync.warn{color:var(--amber);} .sync.warn .dot{background:var(--amber);}
.sync.bad{color:var(--rust);} .sync.bad .dot{background:var(--rust);}

.tag{display:inline-block;border:1px solid var(--steel);color:var(--mute);padding:2px 8px;font-size:12px;font-weight:600;border-radius:3px;}
.tag.on{border-color:var(--amber-dim);color:var(--amber);}

.btn{font-size:15px;font-weight:600;border-radius:4px;border:1px solid var(--steel);background:var(--raised);
  color:var(--bone);padding:11px 15px;cursor:pointer;min-height:44px;}
.btn:hover{background:#332D27;}
.btn:focus-visible,.stepper button:focus-visible,.rirbtn:focus-visible,.wkbtn:focus-visible,.tadj:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1714;}
.btn.primary:hover{background:#F0B155;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px;}
.btn.danger{color:var(--rust);border-color:#4A2B23;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.linkbtn{background:none;border:0;padding:8px 0 0;color:var(--mute);font-size:13px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;}

.panel{background:var(--surface);border:1px solid var(--steel);border-radius:6px;padding:14px;margin-bottom:12px;}
.hr{height:1px;background:var(--steel);border:0;margin:13px 0;}

.daybtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--steel);border-radius:6px;padding:15px;margin-bottom:10px;color:var(--bone);cursor:pointer;}
.daybtn:hover{border-color:var(--amber-dim);}
.daybtn:disabled{opacity:.5;cursor:not-allowed;}
.daybtn .dn{font-size:28px;font-weight:700;line-height:1;}

.wkrow{display:flex;gap:6px;}
.wkbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;border:1px solid var(--steel);
  border-radius:4px;background:var(--surface);color:var(--bone);cursor:pointer;}
.wkbtn .wn{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:22px;font-weight:700;line-height:1;}
.wkbtn .wt2{font-size:10px;line-height:12px;height:12px;color:var(--amber);font-weight:600;}
.wkbtn.next{border-color:var(--amber-dim);}
.wkbtn.on{background:var(--amber);border-color:var(--amber);color:#1A1714;}
.wkbtn.on .wt2{color:#1A1714;}

/* session rail — the dot sits on the line, left of the text */
.rail{position:relative;padding-left:26px;}
.rail:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--steel);}
.station{position:absolute;left:-26px;top:17px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--steel);}
.station.done{background:var(--amber);border-color:var(--amber);}
.station.now{border-color:var(--amber);}
.station.sub{border-style:dashed;border-color:var(--amber);}

.exblock{position:relative;margin-bottom:18px;}
.exhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:12px;}
.exname{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:21px;font-weight:600;line-height:1.1;}
.exmeta{color:var(--mute);font-size:13px;white-space:nowrap;}
.exctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;}
.lastline{color:var(--mute);font-size:12.5px;min-width:0;}
.note{color:var(--amber);font-size:13px;margin-top:6px;}
.subtag{color:var(--amber);font-size:12.5px;margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:8px;}

.pairhead{padding-top:12px;}
.pairline{display:flex;align-items:center;gap:8px;}
.pairline + .pairline{margin-top:3px;}
.badge{width:19px;height:19px;flex:none;border-radius:3px;border:1px solid var(--amber-dim);color:var(--amber);font-size:11px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.badge.sm{width:16px;height:16px;font-size:10px;}
.pname{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:20px;font-weight:600;line-height:1.15;flex:1;min-width:0;}
.pmeta{color:var(--mute);font-size:13px;white-space:nowrap;}

.setrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--steel);
  border-radius:5px;padding:10px 12px;margin-top:6px;color:var(--bone);cursor:pointer;min-height:50px;}
.setrow:hover{border-color:#4C443A;}
.setrow.done{background:#1F2A1C;border-color:#39492F;}
.setrow.open{border-color:var(--amber);}
.setrow.pair{align-items:flex-start;padding-top:10px;padding-bottom:10px;}
.setno{width:20px;color:var(--mute);font-size:13px;font-weight:600;flex:none;}
.setmain{flex:1;min-width:0;}
.setprescribe{font-size:16px;font-weight:600;}
.setlast{font-size:12px;color:var(--mute);}
.setright{font-size:12px;color:var(--mute);text-align:right;flex:none;}
.prow{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.prow + .prow{margin-top:4px;}
.check{width:21px;height:21px;border-radius:4px;border:1px solid var(--steel);flex:none;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--moss);}
.check.on{background:var(--moss);border-color:var(--moss);color:#1A1714;}

.editor{background:var(--raised);border:1px solid var(--amber);border-top:0;border-radius:0 0 5px 5px;padding:10px;margin-top:-4px;}
.psec{border-top:1px solid var(--steel);margin-top:12px;padding-top:12px;}
.psec:first-child{border-top:0;margin-top:0;padding-top:0;}
.psechead{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.psechead .pn{font-size:15px;font-weight:600;flex:1;min-width:0;}
.psechead .pt{font-size:12px;color:var(--mute);white-space:nowrap;}
.pdone{font-size:12px;color:var(--moss);font-weight:600;}
.editrow{display:flex;gap:8px;}
.efield{flex:1;min-width:0;}
.flabel{font-size:11.5px;color:var(--mute);margin-bottom:3px;}
.stepper{display:flex;align-items:stretch;gap:4px;}
.stepper button{width:38px;flex:none;font-size:18px;font-weight:700;background:var(--surface);border:1px solid var(--steel);
  border-radius:4px;color:var(--bone);cursor:pointer;}
.stepper button:hover{background:#332D27;}
.stepper button:active{background:var(--amber);color:#1A1714;}
.stepper.mini button{width:32px;font-size:16px;}
.inp{flex:1;min-width:0;width:100%;background:var(--ink);border:1px solid var(--steel);border-radius:4px;color:var(--bone);
  font-family:inherit;font-size:18px;font-weight:600;padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums;min-height:42px;}
.stepper.mini .inp{font-size:15px;min-height:36px;}
.inp.text{font-size:15px;text-align:left;font-weight:500;min-height:40px;padding:8px 10px;}
.inp:focus{outline:2px solid var(--amber);outline-offset:-1px;}
.rirrow{display:flex;gap:4px;}
.rirbtn{flex:1;padding:8px 0;border:1px solid var(--steel);border-radius:4px;background:var(--surface);color:var(--bone);
  font-weight:600;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;}
.rirbtn.on{background:var(--amber);border-color:var(--amber);color:#1A1714;}

.picker{background:var(--raised);border:1px solid var(--amber);border-radius:6px;padding:10px;margin-top:8px;}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--steel);border-radius:5px;padding:9px 11px;margin-top:6px;color:var(--bone);cursor:pointer;min-height:46px;}
.pickrow:hover{border-color:var(--amber);}
.pickrow .pn{font-size:15px;font-weight:600;}
.pickrow .pm{font-size:12px;color:var(--mute);}
.pickhead{font-size:12px;color:var(--mute);margin-top:12px;}

/* timer bar: fixed to the bottom edge, padded clear of the home indicator */
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--raised);border-top:1px solid var(--amber-dim);
  padding-bottom:env(safe-area-inset-bottom,0px);}
.timerbar .inner{max-width:520px;margin:0 auto;padding:10px 14px 12px;display:flex;align-items:center;gap:12px;}
.timerbar.idle{border-top-color:var(--steel);}
.tclock{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;
  color:var(--amber);min-width:100px;}
.tclock.over{color:var(--moss);}
.tlabel{flex:1;min-width:0;font-size:13px;color:var(--mute);}
.tlabel .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tlabel2{flex:1;font-size:13px;color:var(--mute);}
.tmeter{height:3px;background:var(--steel);margin-top:6px;border-radius:2px;overflow:hidden;}
.tfill{height:100%;background:var(--amber);}
.tset{display:flex;align-items:center;gap:6px;}
.tmini{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:26px;color:var(--amber);min-width:58px;text-align:center;}
.tadj{min-width:38px;height:34px;border:1px solid var(--steel);border-radius:4px;background:var(--surface);color:var(--bone);
  font-weight:700;font-size:16px;cursor:pointer;padding:0 8px;}
.tadj.wide{flex:1;font-size:13px;}
.tadj:active{background:var(--amber);color:#1A1714;}
.tbtns{display:flex;gap:6px;margin-top:8px;}

.banner{border:1px solid var(--amber-dim);background:#2A2118;border-radius:6px;padding:12px;margin-bottom:12px;}
.flag{border:1px solid #4A2B23;background:#2A1C18;border-radius:6px;padding:12px;margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--steel);}
.rowline:last-child{border-bottom:0;}
.inline{display:flex;gap:8px;align-items:center;}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.calh{font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px;}
.calc{aspect-ratio:1;border:1px solid transparent;border-radius:4px;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:12px;cursor:default;font-variant-numeric:tabular-nums;}
.calc.has{background:var(--raised);border-color:var(--amber-dim);color:var(--bone);cursor:pointer;}
.calc.has:hover{border-color:var(--amber);}
.calc.sel{border-color:var(--amber);background:#2A2118;}
.calc .dd{font-size:10px;font-weight:700;color:var(--amber);line-height:1;}
.calc.today{border-color:var(--steel);border-style:dashed;}
.hexrow{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--steel);color:var(--bone);
  padding:8px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.hset{display:flex;align-items:center;gap:8px;margin-top:6px;}
.hset .hn{width:20px;flex:none;font-size:12px;color:var(--mute);}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

/* finish sheet */
.sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.66);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--steel);border-bottom:0;border-radius:10px 10px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));}
/* stats */
.tabs{display:flex;gap:4px;margin:12px 0;background:var(--surface);border:1px solid var(--steel);border-radius:6px;padding:4px;}
.tab{flex:1;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:14px;padding:9px 0;border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.tab.on{background:var(--raised);color:var(--bone);box-shadow:inset 0 -2px 0 var(--amber);}
.tabn{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rust);color:var(--bone);font-size:11px;line-height:18px;}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;}
.chip{flex:none;border:1px solid var(--steel);background:transparent;color:var(--mute);font-size:13px;font-weight:600;padding:6px 12px;border-radius:14px;cursor:pointer;}
.chip.on{border-color:var(--amber);color:var(--amber);}
.panel.tight{padding:10px 12px;margin-bottom:8px;}
.strow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;color:var(--bone);text-align:left;cursor:pointer;}
.stmain{flex:1;min-width:0;}
.stname{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:18px;font-weight:600;line-height:1.15;display:flex;align-items:center;flex-wrap:wrap;}
.stval{font-family:'Barlow Condensed',Barlow,sans-serif;font-size:22px;font-weight:700;white-space:nowrap;}
.spark{flex:none;display:block;}
.chart{width:100%;height:auto;display:block;}
.ctick{fill:var(--mute);font-size:11px;font-family:Barlow,sans-serif;}
.vscroll{overflow-x:auto;}
.vtab{border-collapse:collapse;width:100%;font-size:13px;}
.vtab th{color:var(--mute);font-weight:600;font-size:11px;padding:0 6px 8px;white-space:nowrap;text-align:center;}
.vtab td{padding:3px 6px;text-align:center;}
.vtab td.vg{text-align:left;color:var(--bone);white-space:nowrap;padding-left:12px;font-size:13px;}
.vc{display:inline-block;min-width:30px;padding:4px 0;border-radius:4px;font-weight:700;}
.vc.v0{color:var(--steel);}
.vc.v1{background:#2B2621;color:var(--mute);}
.vc.v2{background:#3A2E1C;color:#D9B37A;}
.vc.v3{background:#5B4220;color:#F3C77E;}
.vc.v4{background:var(--amber);color:#1A1714;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
.legend .vc{min-width:44px;font-size:11px;}
.dbar{display:flex;align-items:center;gap:8px;margin:5px 0;}
.dbar .dl{width:32px;font-size:12px;color:var(--mute);}
.dbar .dt{flex:1;height:10px;background:var(--raised);border-radius:5px;overflow:hidden;}
.dbar .df{display:block;height:100%;background:var(--amber);border-radius:5px;}
.dbar .dn{width:24px;text-align:right;font-size:12px;color:var(--mute);}
.fl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--steel);}
.fl:first-of-type{border-top:0;}
.fk{flex:none;min-width:64px;text-align:center;font-size:11px;font-weight:700;padding:3px 6px;border-radius:3px;border:1px solid var(--steel);color:var(--mute);}
.fk.k-offplan{border-color:var(--amber-dim);color:var(--amber);}
.fk.k-failure,.fk.k-rest{border-color:#4A2B23;color:var(--rust);}
.fk.k-progress{border-color:#39492F;color:var(--moss);}

/* v7: move / skip, carried, flags, swap groups */
.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;}
.exblock.off{opacity:.6;}
.exname.struck{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mute);}
.pickrow .ptag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid var(--steel);color:var(--mute);}
.pickrow .ptag.new{border-color:var(--amber-dim);color:var(--amber);}
.pickhead.eq{color:var(--amber);font-weight:600;}
.untouched{border:1px solid var(--steel);border-radius:6px;padding:8px 10px;margin-bottom:12px;}
.utrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--steel);}
.utrow:first-of-type{border-top:0;}
.seg{display:flex;flex:none;border:1px solid var(--steel);border-radius:4px;overflow:hidden;}
.seg button{border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;}
.seg button.on{background:var(--amber);color:#1A1714;}
.flagrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--amber-dim);}
.flagrow:first-of-type{border-top:0;}
.efield.addw{display:flex;align-items:flex-end;}

/* no zoom: only scrolling gestures, and text boxes at 16px so tapping one doesn't zoom */
html,body{touch-action:pan-x pan-y;}
.inp.text,.stepper.mini .inp{font-size:16px;}

/* landscape: iOS can't lock rotation, so cover the app until it's upright */
.rotate{display:none;}
@media (orientation: landscape) and (max-height: 520px){
  .rotate{display:flex;position:fixed;inset:0;z-index:200;background:var(--ink);color:var(--bone);align-items:center;
    justify-content:center;text-align:center;padding:24px;font-family:'Barlow Condensed',Barlow,sans-serif;font-size:26px;font-weight:700;}
}

/* v7.2: stats card, weight moved, volume bars, fresh flags, calendar completion */
.daybtn.statscard{border-color:var(--amber-dim);background:linear-gradient(rgba(232,163,61,.07),rgba(232,163,61,.07)),var(--surface);}
.daybtn.statscard:hover{border-color:var(--amber);}
.moved{font-size:18px;font-weight:700;line-height:1.2;}
.strip{display:flex;align-items:flex-end;gap:4px;height:44px;margin:12px 0 4px;}
.sbar{flex:1;height:100%;display:flex;align-items:flex-end;}
.sbar span{display:block;width:100%;background:var(--steel);border-radius:2px 2px 0 0;}
.sbar span.now{background:var(--amber);}
.vrow{display:flex;align-items:center;gap:8px;margin:7px 0;}
.vlab{width:100px;flex:none;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vtrack{position:relative;flex:1;height:10px;background:var(--raised);border-radius:5px;overflow:hidden;}
.vband{position:absolute;top:0;bottom:0;background:rgba(126,154,92,.25);}
.vfill{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:5px;opacity:.85;}
.vnum{width:34px;flex:none;text-align:right;font-size:12.5px;font-weight:600;}
.vdelta{width:36px;flex:none;text-align:right;font-size:11.5px;color:var(--mute);}
.vdelta.up{color:var(--moss);}
.vdelta.down{color:var(--rust);}
.panel.tight.fresh{box-shadow:inset 3px 0 0 var(--amber);}
.fk.k-toheavy,.fk.k-offday,.fk.k-offweek{border-color:#4A2B23;color:var(--rust);}
.fk.k-stalled,.fk.k-lowvolume,.fk.k-skipped{border-color:var(--amber-dim);color:var(--amber);}
.calc .dd{display:flex;flex-direction:column;align-items:center;gap:2px;}
.cbar{display:block;width:20px;height:3px;border-radius:2px;}
.cbar.green{background:rgba(126,154,92,.8);}
.cbar.yellow{background:rgba(232,163,61,.7);}
.cbar.red{background:rgba(196,85,58,.75);}
.calc.multi .dd{font-size:8.5px;}
</style>
</head>

<div class="rotate" aria-hidden="true">Turn your phone upright</div>
<div id="root"><div class="boot">Loading your training log…</div></div>
